[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "longpuzzlebench-benchmark"
version = "0.1.0"
description = "Long-horizon visual puzzle-game evaluation for GUI and computer-use agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "imagehash>=4.3.2,<5",
    "jinja2>=3.1,<4",
    "loguru>=0.7,<1",
    "openai>=2.0,<3",
    "pillow>=10,<13",
    "playwright>=1.55,<2",
    "pydantic>=2.10,<3",
    "rich>=13,<15",
]

[project.urls]
Repository = "https://github.com/AzureStarz/LongPuzzleBench"
Issues = "https://github.com/AzureStarz/LongPuzzleBench/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.13,<1",
]

[project.scripts]
longpuzzlebench = "mobile_world.core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mobile_world"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
markers = ["integration: tests requiring the bundled Playwright/Cocos web build"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mobile_world"]
