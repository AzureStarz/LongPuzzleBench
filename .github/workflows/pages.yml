name: Deploy research article

on:
  push:
    branches: [main]
    paths:
      - "blog/longpuzzlebench-agents/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload article
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: blog/longpuzzlebench-agents
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.0
