name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Install Python dependencies
        run: uv sync --extra dev --locked
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Verify research article
        run: uv run python scripts/verify_blog.py
      - name: Build and verify Pages artifact
        run: |
          uv run python scripts/build_pages.py
          uv run python scripts/verify_playground.py
      - name: Test Python harness
        run: uv run pytest -q
      - name: Test game models
        working-directory: games/puzzle_suite
        run: npm test
